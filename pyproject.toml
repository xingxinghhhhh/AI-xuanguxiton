[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-ai-system"
version = "0.1.0"
description = "Read-only A-share market data contract and offline replay MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
baostock = ["baostock>=0.9.3,<0.10"]

[project.scripts]
a-share = "a_share_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
